server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on; gzip_types text/css application/javascript application/json text/html;
  location = /api/chat { proxy_pass http://proxy:3000/api/chat; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_read_timeout 60s; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "public,max-age=300"; }
  location /assets/ { add_header Cache-Control "public,max-age=31536000,immutable"; }
}
